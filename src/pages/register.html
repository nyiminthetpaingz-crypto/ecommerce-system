<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="../output.css" rel="stylesheet">
      <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 text-white flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-xl">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-cyan-400">Create Account</h1>
            <p class="text-gray-400 mt-2">Register to get started</p>
        </div>

        <form id="register-form" class="space-y-5">

            <!-- Full Name -->
            <div>
                <label for="name" class="block text-sm font-medium mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-lg outline-none focus:border-cyan-400"
                >
            </div>

            <!-- Email or Phone -->
            <div>
                <label for="email_or_phone" class="block text-sm font-medium mb-2">
                    Email or Phone Number
                </label>

                <input
                    type="text"
                    id="email_or_phone"
                    placeholder="Enter email or phone number"
                    required
                    class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-lg outline-none focus:border-cyan-400"
                >
            </div>

            <!-- Gender -->
            <div>
                <label for="gender" class="block text-sm font-medium mb-2">
                    Gender
                </label>

                <select
                    id="gender"
                    required
                    class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-lg outline-none focus:border-cyan-400"
                >
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                    minlength="8"
                    class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-lg outline-none focus:border-cyan-400"
                >
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm_password" class="block text-sm font-medium mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    placeholder="Confirm your password"
                    required
                    minlength="8"
                    class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-lg outline-none focus:border-cyan-400"
                >
            </div>

            <!-- Register Button -->
            <button
                type="submit"
                id="register-button"
                class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold rounded-lg transition duration-300"
            >
                Register
            </button>

        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            Already have an account?
            <a href="./login.html" class="text-cyan-400 hover:underline">
                Login
            </a>
        </p>

        <div class="text-center mt-4">
            <a href="./home.html" class="text-gray-400 hover:text-cyan-400 text-sm">
                Back to Home
            </a>
        </div>

    </div>

    <script src="../js/register.js"></script>

</body>
</html>

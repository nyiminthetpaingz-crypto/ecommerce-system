
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center px-5 py-10">

    <div class="w-full max-w-md mx-auto">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold">
                Welcome <span class="text-cyan-400">Back!</span>
            </h1>
            <p class="text-gray-400 mt-3">
                Login to continue shopping with us.
            </p>
        </div>

        <!-- Login Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">

            <form action="#" method="POST" class="space-y-5">

                <!-- Email or Phone -->
                <div>
                    <label class="block text-sm text-gray-300 mb-2">
                        Email or Phone Number
                    </label>
                    <input
                        type="text"
                        name="login"
                        placeholder="Enter email or phone number"
                        autocomplete="username"
                        required
                        class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 outline-none focus:border-cyan-400 transition">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm text-gray-300 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                        class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 outline-none focus:border-cyan-400 transition">
                </div>

                <!-- Remember & Forgot Password -->
                <div class="flex items-center justify-between gap-3 text-sm">

                    <label class="flex items-center gap-2 text-gray-400 cursor-pointer">
                        <input
                            type="checkbox"
                            name="remember"
                            class="accent-cyan-500 w-4 h-4">
                        Remember Me
                    </label>

                    <a href="forgot-password.html"
                        class="text-cyan-400 hover:text-cyan-300 transition">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold py-3 rounded-lg transition duration-300">
                    Login
                </button>

            </form>

            <!-- Register Link -->
            <p class="text-center text-gray-400 text-sm mt-6">
                Don't have an account?
                <a href="register.html"
                    class="text-cyan-400 hover:text-cyan-300 font-semibold transition">
                    Register
                </a>
            </p>

        </div>

        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a href="./home.html"
                class="text-gray-400 hover:text-cyan-400 text-sm transition">
                ← Back to Home
            </a>
        </div>

    </div>

</body>
</html>
